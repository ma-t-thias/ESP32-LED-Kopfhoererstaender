; Update per WLAN, nur fuer den Testbetrieb.
; Diese Datei nach test_ota.ini kopieren (wird nicht eingecheckt) und ein
; eigenes Passwort eintragen. Die normale Firmware (env:esp32-c6-lcd) bleibt
; ohne Update per WLAN.
;
; 1. Einmal per USB: unten in der Statusleiste "env:test-usb" waehlen, Upload.
; 2. Ab dann per WLAN: "env:test-ota" waehlen, Upload.

[test_ota]
password = hier-eigenes-passwort
host = led-kopfhoerer.local   ; oder die IP-Adresse vom Display

; Firmware mit Update per WLAN, hochgeladen per USB
[env:test-usb]
extends = env:esp32-c6-lcd
build_flags =
    ${env:esp32-c6-lcd.build_flags}
    '-DOTA_PASSWORD="${test_ota.password}"'

; Dieselbe Firmware, hochgeladen per WLAN
[env:test-ota]
extends = env:test-usb
upload_protocol = espota
upload_port = ${test_ota.host}
upload_flags = --auth=${test_ota.password}
