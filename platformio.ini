; Firmware fuer den LED-Kopfhoererstaender
; Board: Waveshare ESP32-C6-Touch-LCD-1.9 (ESP32-C6FH8, 8 MB Flash, ST7789 170x320, Touch CST816D)
; LED: WS2812B, 144 LEDs, Daten an GPIO3 (ueber 74AHCT125)
; Das alte ESP32-C6-LCD-1.3 baut env:esp32-c6-lcd-13.

[platformio]
; Normaler Build (ohne Update per WLAN). Die Test-Umgebungen aus test_ota.ini
; waehlt man in VS Code unten in der Statusleiste aus.
default_envs = esp32-c6-lcd
; Nur fuer den Testbetrieb, nicht eingecheckt: siehe test_ota.example.ini
extra_configs = test_ota.ini

[env:esp32-c6-lcd]
; Der ESP32-C6 braucht Arduino-Core 3.x. Die offizielle "espressif32"-Plattform
; liefert den nicht mit, deshalb die Community-Plattform pioarduino (fest gepinnt).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; Das Board hat 8 MB Flash: Platz fuer Matter und zwei App-Slots fuer Updates per WLAN.
; Die Partitionstabelle wird nur per USB geschrieben, nicht per WLAN-Update.
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
; Groesse eines App-Slots; PlatformIO bricht ab, wenn die Firmware nicht passt.
board_upload.maximum_size = 3932160

; Versionskennung (Git-Tag + Hash) fuer Startbild und Weboberflaeche
extra_scripts = pre:tools/version.py

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWITH_MATTER

lib_deps =
    fastled/FastLED@3.10.3
    moononournation/GFX Library for Arduino@1.6.0
    bblanchon/ArduinoJson@7.2.1

; Altes Board Waveshare ESP32-C6-LCD-1.3 (4 MB Flash, 240x240, ohne Touch).
; Ohne Matter: in 4 MB passt Matter nicht neben zwei Update-Slots.
[env:esp32-c6-lcd-13]
extends = env:esp32-c6-lcd
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_upload.maximum_size = 1966080
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_LCD_13
